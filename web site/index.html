<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DailyMart BD - Fresh Products. Fair Prices. Delivered Daily. Shop fresh vegetables, fish, meat, groceries and everyday essentials in Bangladesh." />
  <title>DailyMart BD - Fresh Products Delivered Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deepgreen: { DEFAULT: '#166534', hover: '#14532D', dark: '#14532D', light: '#15803d' },
            lime: { DEFAULT: '#84CC16', hover: '#65a30d', light: '#a3e635' },
            charcoal: '#17251B',
            grocery: {
              page: '#F8FAF7',
              card: '#FFFFFF',
              border: '#E2E8E4',
              price: '#16A34A',
              sale: '#DC2626',
              catBg: '#F0FDF4',
              catHover: '#DCFCE7',
              catText: '#166534'
            }
          },
          fontFamily: { sans: ['Inter','Segoe UI','sans-serif'] },
          boxShadow: { card:'0 2px 10px rgba(22,101,52,0.06)', 'card-hover':'0 8px 24px rgba(22,101,52,0.12)' }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=5.0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
</head>
<body class="font-sans bg-[#F8FAF7] text-[#17251B] antialiased">
  <!-- App Root -->
  <div id="app">
    <!-- Header -->
    <div id="header-root"></div>
    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
    <!-- Main Content -->
    <main id="page-content" class="min-h-screen"></main>
    <!-- Mobile Bottom Nav -->
    <div id="mobile-nav-root"></div>
    <!-- Footer -->
    <div id="footer-root"></div>
    <!-- Cart Drawer -->
    <div id="cart-drawer-root"></div>
    <!-- Search Overlay -->
    <div id="search-overlay-root"></div>
    <!-- Modal Root -->
    <div id="modal-root"></div>
  </div>

  <!-- Core data and utilities -->
  <script src="js/data/categories.js?v=4.0"></script>
  <script src="js/data/products.js?v=4.0"></script>
  <script src="js/data/districts.js?v=4.0"></script>
  <script src="js/core/store.js?v=4.0"></script>
  <script src="js/core/router.js?v=4.0"></script>
  <script src="js/core/utils.js?v=4.0"></script>
  <!-- Components -->
  <script src="js/components/toast.js?v=5.0"></script>
  <script src="js/components/header.js?v=5.0"></script>
  <script src="js/components/footer.js?v=5.0"></script>
  <script src="js/components/mobileNav.js?v=5.0"></script>
  <script src="js/components/categoryCard.js?v=5.0"></script>
  <script src="js/components/productCard.js?v=5.0"></script>
  <script src="js/components/productFilters.js?v=5.0"></script>
  <script src="js/components/cartDrawer.js?v=5.0"></script>
  <script src="js/components/searchOverlay.js?v=5.0"></script>
  <!-- Pages -->
  <script src="js/pages/home.js?v=5.0"></script>
  <script src="js/pages/category.js?v=5.0"></script>
  <script src="js/pages/productType.js?v=4.0"></script>
  <script src="js/pages/productDetail.js?v=4.0"></script>
  <script src="js/pages/cart.js?v=4.0"></script>
  <script src="js/pages/checkout.js?v=4.0"></script>
  <script src="js/pages/orderConfirmation.js?v=4.0"></script>
  <script src="js/pages/search.js?v=4.0"></script>
  <script src="js/pages/wishlist.js?v=4.0"></script>
  <script src="js/pages/account.js?v=4.0"></script>
  <script src="js/pages/auth.js?v=4.0"></script>
  <script src="js/pages/admin.js?v=4.0"></script>
  <script src="js/pages/notFound.js?v=4.0"></script>
  <!-- App Bootstrap -->
  <script src="js/app.js?v=4.0"></script>
</body>
</html>
