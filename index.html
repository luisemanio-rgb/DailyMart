<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DailyMart BD - Fresh Products. Fair Prices. Delivered Daily. Shop fresh vegetables, fish, meat, groceries and everyday essentials in Bangladesh." />
  <title>DailyMart BD - Fresh Products Delivered Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50:'#f0fdf4', 100:'#dcfce7', 200:'#bbf7d0', 300:'#86efac', 400:'#4ade80', 500:'#22c55e', 600:'#16a34a', 700:'#15803d', 800:'#166534', 900:'#14532d', 950:'#052e16' },
            brand: { light:'#34d399', DEFAULT:'#10b981', dark:'#059669', accent:'#f59e0b', red:'#ef4444' }
          },
          fontFamily: { sans: ['Inter','Segoe UI','sans-serif'] },
          boxShadow: { card:'0 2px 12px rgba(0,0,0,0.08)', 'card-hover':'0 8px 30px rgba(0,0,0,0.14)' },
          animation: { 'fade-in':'fadeIn 0.3s ease', 'slide-up':'slideUp 0.3s ease', 'pulse-once':'pulse 0.6s ease' }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=4.0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
</head>
<body class="font-sans bg-gray-50 text-gray-800 antialiased">
  <!-- App Root -->
  <div id="app">
    <!-- Header -->
    <div id="header-root"></div>
    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
    <!-- Main Content -->
    <main id="page-content" class="min-h-screen"></main>
    <!-- Mobile Bottom Nav -->
    <div id="mobile-nav-root"></div>
    <!-- Footer -->
    <div id="footer-root"></div>
    <!-- Cart Drawer -->
    <div id="cart-drawer-root"></div>
    <!-- Search Overlay -->
    <div id="search-overlay-root"></div>
    <!-- Modal Root -->
    <div id="modal-root"></div>
  </div>

  <!-- Core data and utilities -->
  <script src="js/data/categories.js?v=4.0"></script>
  <script src="js/data/products.js?v=4.0"></script>
  <script src="js/data/districts.js?v=4.0"></script>
  <script src="js/core/store.js?v=4.0"></script>
  <script src="js/core/router.js?v=4.0"></script>
  <script src="js/core/utils.js?v=4.0"></script>
  <!-- Components -->
  <script src="js/components/toast.js?v=4.0"></script>
  <script src="js/components/header.js?v=4.1"></script>
  <script src="js/components/footer.js?v=4.0"></script>
  <script src="js/components/mobileNav.js?v=4.0"></script>
  <script src="js/components/categoryCard.js?v=4.0"></script>
  <script src="js/components/productCard.js?v=4.3"></script>
  <script src="js/components/productFilters.js?v=4.0"></script>
  <script src="js/components/cartDrawer.js?v=4.0"></script>
  <script src="js/components/searchOverlay.js?v=4.0"></script>
  <!-- Pages -->
  <script src="js/pages/home.js?v=4.0"></script>
  <script src="js/pages/category.js?v=4.0"></script>
  <script src="js/pages/productType.js?v=4.0"></script>
  <script src="js/pages/productDetail.js?v=4.0"></script>
  <script src="js/pages/cart.js?v=4.0"></script>
  <script src="js/pages/checkout.js?v=4.0"></script>
  <script src="js/pages/orderConfirmation.js?v=4.0"></script>
  <script src="js/pages/search.js?v=4.0"></script>
  <script src="js/pages/wishlist.js?v=4.0"></script>
  <script src="js/pages/account.js?v=4.0"></script>
  <script src="js/pages/auth.js?v=4.0"></script>
  <script src="js/pages/admin.js?v=4.0"></script>
  <script src="js/pages/notFound.js?v=4.0"></script>
  <!-- App Bootstrap -->
  <script src="js/app.js?v=4.0"></script>
</body>
</html>
