<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DailyMart BD - Fresh Products. Fair Prices. Delivered Daily. Shop fresh vegetables, fish, meat, groceries and everyday essentials in Bangladesh." />
  <title>DailyMart BD - Fresh Products Delivered Daily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#087F5B',
              dark: '#056B4D',
              light: '#E8F7F1',
              50: '#E8F7F1',
              600: '#087F5B',
              700: '#056B4D',
              800: '#04523B'
            },
            accent: {
              DEFAULT: '#FF7A18',
              hover: '#EA680C',
              light: '#FFF4EB'
            },
            canvas: '#F8FAF9',
            surface: '#FFFFFF',
            textmain: '#17212B',
            textmuted: '#667085',
            borderui: '#E5E7EB',
            discount: '#E5484D',
            success: '#16A34A'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans Bengali"', 'Inter', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            card: '0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03)',
            'card-hover': '0 6px 16px rgba(0,0,0,0.07)',
            subtle: '0 1px 2px rgba(0,0,0,0.04)'
          },
          borderRadius: {
            control: '8px',
            card: '14px',
            section: '18px'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=7.0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
</head>
<body class="font-sans bg-[#F8FAF9] text-[#17212B] antialiased">
  <!-- App Root -->
  <div id="app">
    <!-- Header -->
    <div id="header-root"></div>
    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
    <!-- Main Content -->
    <main id="page-content" class="min-h-screen"></main>
    <!-- Mobile Bottom Nav -->
    <div id="mobile-nav-root"></div>
    <!-- Footer -->
    <div id="footer-root"></div>
    <!-- Cart Drawer -->
    <div id="cart-drawer-root"></div>
    <!-- Search Overlay -->
    <div id="search-overlay-root"></div>
    <!-- Modal Root -->
    <div id="modal-root"></div>
  </div>

  <!-- Core data and utilities -->
  <script src="js/data/categories.js?v=7.0"></script>
  <script src="js/data/products.js?v=7.0"></script>
  <script src="js/data/districts.js?v=7.0"></script>
  <script src="js/core/store.js?v=7.0"></script>
  <script src="js/core/router.js?v=7.0"></script>
  <script src="js/core/utils.js?v=7.0"></script>
  <script src="js/core/icons.js?v=7.0"></script>
  <!-- Components -->
  <script src="js/components/toast.js?v=7.0"></script>
  <script src="js/components/header.js?v=7.0"></script>
  <script src="js/components/footer.js?v=7.0"></script>
  <script src="js/components/mobileNav.js?v=7.0"></script>
  <script src="js/components/categoryCard.js?v=7.0"></script>
  <script src="js/components/productCard.js?v=7.0"></script>
  <script src="js/components/productFilters.js?v=7.0"></script>
  <script src="js/components/cartDrawer.js?v=7.0"></script>
  <script src="js/components/searchOverlay.js?v=7.0"></script>
  <!-- Pages -->
  <script src="js/pages/home.js?v=7.0"></script>
  <script src="js/pages/category.js?v=7.0"></script>
  <script src="js/pages/productType.js?v=7.0"></script>
  <script src="js/pages/productDetail.js?v=7.0"></script>
  <script src="js/pages/cart.js?v=7.0"></script>
  <script src="js/pages/checkout.js?v=7.0"></script>
  <script src="js/pages/orderConfirmation.js?v=7.0"></script>
  <script src="js/pages/search.js?v=7.0"></script>
  <script src="js/pages/wishlist.js?v=7.0"></script>
  <script src="js/pages/account.js?v=7.0"></script>
  <script src="js/pages/auth.js?v=7.0"></script>
  <script src="js/pages/admin.js?v=7.0"></script>
  <script src="js/pages/notFound.js?v=7.0"></script>
  <!-- App Bootstrap -->
  <script src="js/app.js?v=7.0"></script>
</body>
</html>
